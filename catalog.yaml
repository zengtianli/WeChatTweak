name: WeChatTweak
summary: >
  macOS 微信补丁 CLI（Swift Package，fork 自 sunnyyoung/WeChatTweak）。纯字节补丁工具，
  新增微信 4.x（build 268880 → 269627）防撤回 + 屏蔽自动更新支持——改 wechat.dylib 里 parseRevokeXML 的
  cbz→b 让撤回永远走不到删消息代码（silent 变体），或清零 newmsgid 留消息且私聊保留撤回提示
  （keeptip 变体；群聊仍无提示）；默认同时把 XAppUpdateManager 的 8 个更新入口钉死（微信自动更新会整包
  换掉补丁，defaults 挡不住）。config.json 是补丁数据 SSOT（按 CFBundleVersion 匹配 + 写入前原始字节校验），
  signatures.json 是定位规则 SSOT（撤回签名各代 + update 方法名）；补丁点优先从 fzlzjerry/wechat-antirecall 同步。
  `doctor` 子命令只读体检并按 SIP 开/关给结论。
key_scripts:
  - Sources/WeChatTweak/main.swift    # ArgumentParser 入口 + versions/patch 子命令
  - Sources/WeChatTweak/Command.swift # 编排：读版本、逐 target 打补丁、重签名
  - Sources/WeChatTweak/Config.swift  # config.json 解码
  - Sources/WeChatTweak/Patcher.swift # Mach-O VA→偏移 + 字节校验 + 等长写入
  - Sources/WeChatTweak/RevokeLocator.swift  # --auto-locate 按签名代扫 dylib（防撤回点）
  - Sources/WeChatTweak/UpdateLocator.swift  # 屏蔽更新点：ObjC 方法表按名取 IMP + 入口形态校验
  - Sources/WeChatTweak/Doctor.swift         # doctor：构建号/SIP/签名/entitlements/补丁状态 → 下一步命令
  - Sources/WeChatTweak/Resigner.swift       # 保留 entitlements 的 ad-hoc 重签名（SIP 开启机器上不闪退的关键）
  - config.json                       # 补丁数据 SSOT（每构建号一组 targets/entries）
  - signatures.json                   # 签名各代 SSOT → tools/gen_signatures.py 派生 Swift 表
  - tools/sync_ref.py                 # 从参考实现同步补丁点（本机构建逐字节校验）
  - tools/locate_revoke.py            # 防撤回点自主定位器（兜底）
  - tools/locate_update.py            # 屏蔽更新点自主定位器（ObjC 方法表法）
  - Makefile                          # swift build 通用二进制
depends_on:
  - apple/swift-argument-parser (>=1.6.0)

lifecycle: active      # 2026-08-28 复活:微信更新到 4.1.13/269579 重新加补丁点;09-01 269626 定位器改按「代」扫;09-03 269627 + 默认屏蔽自动更新 + doctor
form: mac
origin: third_party    # Sunnyyoung · 229 commits 我 26 · 微信 4.x 防撤回,上游 PR #1039 OPEN
upstream: https://github.com/Sunnyyoung/WeChatTweak
